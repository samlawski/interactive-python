<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <!-- Styles are inline because this page is served at any path.
       Colors match the variables in src/css/style.css. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #142a30;
      line-height: 1.65;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .container {
      max-width: 440px;
    }
    .code {
      font-size: 5.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #1b6170;
      line-height: 1;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin: 1rem 0 0.5rem;
    }
    .mark {
      background: linear-gradient(transparent 55%, #ffe27a 55%);
      padding: 0 0.1em;
    }
    p {
      color: #586a70;
      margin-bottom: 1.5rem;
    }
    a {
      color: #1b6170;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0.5rem 1.1rem;
      background: #1b6170;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    a.btn:hover { background: #154c58; }
    a.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(27, 97, 112, 0.18); }
    .site-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 2rem;
      font-size: 0.75rem;
      line-height: 1.5;
      color: #586a70;
    }
    .site-footer p { margin: 0.25rem 0; }
    .site-footer a { color: inherit; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1><span class="mark">Page Not Found</span></h1>
    <p>Why don't you try the interactive Python editor on the <a href="/">home page</a>?</p>
    <a class="btn" href="/">← Back to Home</a>
  </div>

  {{FOOTER}}
</body>
</html>
