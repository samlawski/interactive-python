<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Python Tutorials</title>
  <link rel="stylesheet" href="{{BASE}}assets/style.css">
</head>
<body>
  <div class="container">

    <header class="page-header">
      <a class="back-link" href="../">← All tutorials</a>
      <h1><span class="mark">{{TITLE}}</span></h1>
    </header>

    <div class="nb-toolbar">
      <span id="python-status">⏳ Loading Python… You can start reading already.</span>
      <button id="restart-btn" class="btn-small" title="Forget all variables and start fresh" disabled>↺ Restart Python</button>
    </div>

    <article class="notebook instructions card">
      {{CELLS_HTML}}
    </article>

    <nav class="nb-nav">
      <a class="btn btn-secondary" href="../">← All tutorials</a>
      {{NEXT_LINK}}
    </nav>

  </div>

  {{FOOTER}}

  <!-- Embedded tutorial data (filled by build.js) -->
  <script id="tutorial-data" type="application/json">{{TUTORIAL_DATA}}</script>

  <!-- Pyodide (loaded as global, NOT bundled) -->
  <script src="{{BASE}}pyodide/pyodide.js"></script>

  <!-- App bundle -->
  <script type="module" src="{{BASE}}assets/tutorial-page.js"></script>
</body>
</html>
